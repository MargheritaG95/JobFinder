<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JobFinder</title>
  <meta name="theme-color" content="#6f35d0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <main id="auth-shell" class="auth-shell">
    <section class="auth-card" id="auth-card">
      <div class="auth-brand"><span class="brand-mark">▣</span><div><strong>JobFinder</strong><small>Find your next role. Faster.</small></div></div>
      <h1>Accedi</h1>
      <p class="muted">Usa il tuo account JobFinder.</p>
      <label>Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="nome@email.com">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="••••••••">
      <button id="login-btn" class="btn btn-primary btn-wide">Accedi</button>
      <div class="auth-links">
        <button id="forgot-btn" class="link-btn">Password dimenticata?</button>
        <button id="signup-btn" class="link-btn">Crea account</button>
      </div>
      <div id="message" class="message hidden"></div>
    </section>

    <section class="auth-card hidden" id="reset-card">
      <div class="auth-brand"><span class="brand-mark">▣</span><div><strong>JobFinder</strong><small>Find your next role. Faster.</small></div></div>
      <h1>Nuova password</h1>
      <p class="muted">Scegli la nuova password per il tuo account.</p>
      <label>Nuova password</label>
      <input id="new-password" type="password" minlength="8" placeholder="Minimo 8 caratteri">
      <button id="save-password-btn" class="btn btn-primary btn-wide">Salva password</button>
      <div id="reset-message" class="message hidden"></div>
    </section>
  </main>

  <main id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark lg">▣</div>
        <div><strong>JobFinder</strong><small>Find your next role. Faster.</small></div>
      </div>
      <nav id="sidebar-nav">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span>Dashboard</button>
        <button class="nav-item" data-page="opportunities"><span>◎</span>Opportunità</button>
        <button class="nav-item" data-page="pipeline"><span>▥</span>Pipeline</button>
        <button class="nav-item" data-page="applications"><span>▤</span>Le mie Application</button>
        <button class="nav-item" data-page="companies"><span>▦</span>Aziende Target</button>
        <button class="nav-item" data-page="followups"><span>♧</span>Follow-up</button>
        <button class="nav-item" data-page="feedback"><span>♡</span>Feedback</button>
        <button class="nav-item" data-page="preferences"><span>⚙</span>Preferenze</button>
        <button class="nav-item" data-page="resources"><span>▧</span>Risorse</button>
        <button class="nav-item" data-page="analytics"><span>⌁</span>Analytics</button>
      </nav>
      <div class="fit-card">
        <strong>Fit medio</strong>
        <div class="ring"><span id="avg-fit">—</span></div>
        <p>Continua così 🚀</p>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div>
          <h1 id="greeting">Bentornato!</h1>
          <p id="page-subtitle">Ecco il tuo overview di oggi</p>
        </div>
        <div class="top-actions"><span id="user-email"></span><button id="logout-btn" class="btn btn-ghost">↪ Esci</button></div>
      </header>
      <div id="content" class="content"></div>
    </section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <section class="modal">
      <button id="modal-close" class="modal-close">×</button>
      <div id="modal-content"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
