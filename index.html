<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JobFinder</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <main class="shell">
    <section class="card" id="auth-card">
      <div class="brand">JobFinder</div>
      <h1>Accedi</h1>
      <p class="subtitle">Email + password oppure Google.</p>

      <button id="google-btn" class="google">Continua con Google</button>

      <div class="separator"><span>oppure</span></div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="nome@email.com" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Minimo 8 caratteri" />

      <button id="login-btn" class="primary">Accedi</button>

      <div class="row-actions">
        <button id="forgot-btn" class="linkbtn">Password dimenticata?</button>
        <button id="signup-btn" class="linkbtn">Crea account</button>
      </div>

      <div id="message" class="message hidden"></div>
    </section>

    <section class="card hidden" id="reset-card">
      <div class="brand">JobFinder</div>
      <h1>Nuova password</h1>
      <p class="subtitle">Inserisci una nuova password per il tuo account.</p>
      <label for="new-password">Nuova password</label>
      <input id="new-password" type="password" minlength="8" placeholder="Minimo 8 caratteri" />
      <button id="save-password-btn" class="primary">Salva nuova password</button>
      <div id="reset-message" class="message hidden"></div>
    </section>

    <section class="card hidden" id="dashboard-card">
      <div class="brand">JobFinder</div>
      <h1>Dashboard</h1>
      <p id="welcome" class="subtitle"></p>
      <p class="ok">Accesso riuscito.</p>
      <button id="logout-btn" class="secondary">Esci</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
