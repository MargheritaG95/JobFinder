<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobFinder</title>
<link rel="stylesheet" href="styles.css?v=20260901-3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260901-3"></script>
</head>
<body>
<section id="auth" class="auth-wrap">
  <div class="auth-card">
    <h1>JobFinder</h1><p>Find your next role. Faster.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login" class="primary">Accedi</button>
    <button id="forgot" class="link">Password dimenticata?</button>
    <div id="auth-msg"></div>
  </div>
</section>

<section id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo">▣</div><div><b>JobFinder</b><small>Find your next role. Faster.</small></div></div>
    <nav id="nav">
      <button data-page="dashboard" class="nav active">⌂ Dashboard</button>
      <button data-page="opportunities" class="nav">◎ Opportunità</button>
      <button data-page="pipeline" class="nav">▥ Pipeline</button>
      <button data-page="applications" class="nav">▤ Le mie Application</button>
      <button data-page="companies" class="nav">▦ Aziende Target</button>
      <button data-page="followups" class="nav">♧ Follow-up</button>
      <button data-page="feedback" class="nav">♡ Feedback</button>
      <button data-page="preferences" class="nav">⚙ Preferenze</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1 id="title">Bentornata 👋</h1><p id="subtitle">Ecco il tuo overview di oggi</p></div>
      <div class="user"><span id="user-email"></span><button id="logout" class="ghost">Esci</button></div>
    </header>
    <div id="content" class="content"></div>
  </main>
</section>

<div id="modal" class="modal-wrap hidden">
  <div class="modal">
    <button id="close-modal" class="close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js?v=20260901-3"></script>
</body>
</html>
