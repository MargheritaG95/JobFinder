<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JobFinder</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <main class="shell">
    <section class="card" id="auth-card">
      <div class="brand">JobFinder</div>
      <h1>Accedi</h1>
      <p class="subtitle">Solo email e password. Nessun magic link, nessun Google login.</p>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="nome@email.com" />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Minimo 8 caratteri" />

      <button id="login-btn" class="primary">Accedi</button>
      <button id="signup-btn" class="secondary">Crea account</button>

      <p id="message" class="message"></p>
    </section>

    <section class="card hidden" id="dashboard-card">
      <div class="brand">JobFinder</div>
      <h1>Dashboard</h1>
      <p id="welcome" class="subtitle"></p>
      <p class="ok">Login Supabase riuscito.</p>
      <button id="logout-btn" class="secondary">Esci</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
